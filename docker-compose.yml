version: "3.9"

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      # Redis / Session store — point to your ElastiCache endpoint
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # External service endpoints
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payment-service.default.svc.cluster.local:9090/payments/charge}
      # File paths (override via ConfigMap in EKS)
      REPORT_BASE_PATH: ${REPORT_BASE_PATH:-/var/reports}
      BACKUP_PATH: ${BACKUP_PATH:-/var/backups/resorts}
      CACHE_PROVIDER: ${CACHE_PROVIDER:-redis}
      # JVM options
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    volumes:
      - reports-data:/var/reports
      - backup-data:/var/backups/resorts
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  reports-data:
  backup-data:

networks:
  app-network:
    driver: bridge
