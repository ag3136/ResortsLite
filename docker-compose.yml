version: "3.9"

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      # JVM settings
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker
      # Server port
      SERVER_PORT: "8080"
      # Redis (external ElastiCache — supply real values)
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # S3 buckets (external — supply real values)
      S3_REPORT_BUCKET: ${S3_REPORT_BUCKET:-resorts-reports-bucket}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-resorts-backup-bucket}
      # AWS region for SDK
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # External service URLs
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payment-service/payments/charge}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://report-service/api/reports}
      # Timezone
      TZ: UTC
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
