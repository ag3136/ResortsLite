# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# FIXED cz-java-0062: Externalized payment service IP address to environment variable
# Use Kubernetes Service DNS name for inter-service communication on Amazon EKS
# Override via environment variable: PAYMENT_SERVICE_URL
PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:http://payment-service:9090/payments/charge}

# FIXED cz-java-0057: Externalized file paths to support ConfigMap injection
# These can be overridden via environment variables: APP_REPORT_BASE_PATH, APP_BACKUP_PATH
app.report.base.path=${APP_REPORT_BASE_PATH:/var/reports}
app.backup.path=${APP_BACKUP_PATH:/var/backups}

# Health check endpoint configuration for containerization
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# FIXED cz-java-0069: Spring Session with Redis for externalized session storage
# Sessions are stored in Amazon ElastiCache (Redis) for horizontal scaling and container restarts
# This replaces in-memory HttpSession storage that is lost when containers restart or scale
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms

# FIXED cz-java-0070: Redis cache configuration for distributed caching
# Replaces local in-memory caches with Amazon ElastiCache (Redis) for horizontal scaling
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
