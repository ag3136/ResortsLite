# ResortsLite - Configuration
spring.application.name=ResortsLite

# blocker-11 (cz-java-0061): Port is now externalized — override via SERVER_PORT env var
# in container deployment (AKS / Azure Container Apps).
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# blocker-4/5/6/7/8/13 (cz-java-0063 / cz-java-0069 / cz-java-0070):
# Spring Session Data Redis — distributed session and cache storage.
# Set REDIS_HOST and REDIS_PORT via environment variables in container deployment.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# blocker-1/2/3 (cz-java-0057): Azure Blob Storage configuration.
# Set AZURE_BLOB_REPORTS_URL and AZURE_BLOB_BACKUP_URL via environment variables.
AZURE_BLOB_REPORTS_URL=${AZURE_BLOB_REPORTS_URL:https://storageaccount.blob.core.windows.net/reports}
AZURE_BLOB_BACKUP_URL=${AZURE_BLOB_BACKUP_URL:https://storageaccount.blob.core.windows.net/backups}

# blocker-12 (cz-java-0062): Payment API URL — set PAYMENT_API_URL env var to override.
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service/payments/charge}

# health-check-endpoint: Expose /actuator/health for container liveness/readiness probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
