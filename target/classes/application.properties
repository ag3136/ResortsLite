# ResortsLite - Configuration
spring.application.name=ResortsLite

# blocker-11 (cz-java-0061): Server port now sourced from SERVER_PORT environment variable,
# enabling dynamic port binding in ECS/EKS container deployments.
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# blocker-4/5/6/7/8 (cz-java-0063 / cz-java-0069): Spring Session backed by Amazon
# ElastiCache for Redis. REDIS_HOST and REDIS_PORT are supplied as environment variables
# in ECS/EKS task definitions, enabling distributed session management across instances.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# blocker-2/3 (cz-java-0057): S3 bucket names for report and backup storage,
# sourced from environment variables to avoid hardcoded filesystem paths.
S3_REPORT_BUCKET=${S3_REPORT_BUCKET:resorts-reports-bucket}
S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:resorts-backup-bucket}

# blocker-12 (cz-java-0062): Payment API URL sourced from environment variable,
# replacing hardcoded IP address 10.0.1.45 for flexible container deployment.
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service/payments/charge}

# blocker-9 (cz-java-0082): Report service URL sourced from environment variable,
# enabling independent microservice deployment via AWS App Mesh / API Gateway.
REPORT_SERVICE_URL=${REPORT_SERVICE_URL:http://report-service/api/reports}

# Health check endpoint: Expose /actuator/health for container liveness/readiness probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
