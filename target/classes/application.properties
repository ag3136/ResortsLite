# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fixed: cz-java-0082 - Externalized inventory service endpoint for microservices architecture
# In GKE deployment, this should point to the inventory service via Kubernetes service discovery
# Example: http://inventory-service:8081 (where inventory-service is the Kubernetes service name)
# Can be overridden via environment variable INVENTORY_SERVICE_URL
app.inventory.endpoint=${INVENTORY_SERVICE_URL:http://localhost:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.notification.endpoint=http://notify.internal:7070/send

# Fixed: cz-java-0057 - Externalized file paths to support containerization
# These can be overridden via environment variables REPORT_PATH and BACKUP_PATH
# or via Kubernetes ConfigMaps
app.report.path=${REPORT_PATH:/app/reports}
app.backup.path=${BACKUP_PATH:/app/backups}


# Fixed: cz-java-0063 - Externalized session storage to Redis for horizontal scaling
# Spring Session configuration for Google Cloud Memorystore (Redis)
spring.session.store-type=redis
# Fixed: cz-java-0070 - Redis configuration for distributed caching
# Replaces local in-memory caches with Google Cloud Memorystore for Redis
# Connection details injected via environment variables for GKE deployment
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Cache TTL configuration (in seconds)
app.cache.ttl=${CACHE_TTL:3600}

management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.defaults.enabled=true
