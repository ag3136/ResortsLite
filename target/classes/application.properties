# ResortsLite - Legacy Configuration
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# blocker-1/2 (cz-java-0057): Absolute file path externalized via environment variable.
# Inject REPORT_BASE_PATH via Kubernetes ConfigMap in EKS Pod spec.
REPORT_BASE_PATH=${REPORT_BASE_PATH:/var/reports}

# blocker-3 (cz-java-0057): Windows-style backup path externalized via environment variable.
# Inject BACKUP_PATH via Kubernetes ConfigMap in EKS Pod spec.
BACKUP_PATH=${BACKUP_PATH:/var/backups/resorts}

# blocker-11 (cz-java-0061): Hardcoded port externalized via environment variable.
# Inject SERVER_PORT via Kubernetes ConfigMap in EKS Pod spec.
SERVER_PORT=${SERVER_PORT:8080}

# blocker-12 (cz-java-0062): Hardcoded IP address externalized via environment variable.
# Inject PAYMENT_API_URL via Kubernetes ConfigMap using cluster-internal DNS on EKS.
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service.default.svc.cluster.local:9090/payments/charge}

# blocker-13 (cz-java-0070): Local cache provider externalized via environment variable.
# Inject CACHE_PROVIDER via Kubernetes ConfigMap; use Amazon ElastiCache (Redis) on EKS.
CACHE_PROVIDER=${CACHE_PROVIDER:redis}

# blocker-4/5/6/7/8 (cz-java-0063/cz-java-0069): Spring Session with Redis for
# externalized session storage on Amazon ElastiCache. Inject REDIS_HOST and REDIS_PORT
# via Kubernetes ConfigMap / Secret in EKS Pod spec.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Health check endpoint: Spring Boot Actuator exposes /actuator/health for container
# liveness and readiness probes in Kubernetes / EKS.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
