apiVersion: apps/v1
kind: Deployment
metadata:
  name: brdresort
  namespace: brdresort
  labels:
    app: brdresort
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brdresort
  template:
    metadata:
      labels:
        app: brdresort
        version: "1.0.0"
    spec:
      containers:
        - name: brdresort
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
            - name: TZ
              value: "UTC"
            # Redis connection — set via Kubernetes Secret or ConfigMap
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              value: "{{REDIS_PASSWORD}}"
            # Azure Blob Storage URLs
            - name: AZURE_BLOB_REPORTS_URL
              value: "{{AZURE_BLOB_REPORTS_URL}}"
            - name: AZURE_BLOB_BACKUP_URL
              value: "{{AZURE_BLOB_BACKUP_URL}}"
            # Payment API URL
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
