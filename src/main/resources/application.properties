# ResortsLite - Cloud-Ready Configuration for Azure
# All sensitive values and environment-specific configurations externalized

spring.application.name=ResortsLite

# FIXED cr-java-0077: Port now configurable via environment variable for dynamic assignment
server.port=${PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Database credentials removed from properties file
# Credentials are now loaded from Azure Key Vault in BookingService
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Azure Key Vault Configuration
# FIXED cr-java-0069: Azure Key Vault integration for secrets management
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://your-keyvault.vault.azure.net/}

# Azure Blob Storage Configuration
# FIXED cr-java-0061, cr-java-0062, cr-java-0063: Azure Blob Storage for file operations
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:yourstorageaccount}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=yourstorageaccount;AccountKey=yourkey;EndpointSuffix=core.windows.net}

# Azure Service Bus Configuration
# FIXED cr-java-0111: Azure Service Bus for scheduled message delivery
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://yournamespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=yourkey}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-reports}

# Azure Cache for Redis Configuration
# FIXED cr-java-0065, cr-java-0067: Redis for distributed session and cache management
spring.redis.host=${REDIS_HOST:your-redis.redis.cache.windows.net}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:your-redis-key}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=2000ms

# Spring Session Configuration
# FIXED cr-java-0065: Enable Spring Session with Redis for distributed session management
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Redis Cache Configuration
# FIXED cr-java-0067: Redis cache with TTL policies
spring.cache.type=redis
spring.cache.redis.time-to-live=86400000
spring.cache.redis.cache-null-values=false

# Azure Active Directory Configuration
# FIXED cr-java-0090: Azure AD integration for authentication
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:your-tenant-id}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:your-client-id}
azure.activedirectory.client-secret=${AZURE_AD_CLIENT_SECRET:your-client-secret}
azure.activedirectory.user-group.allowed-groups=${AZURE_AD_ALLOWED_GROUPS:ResortsLiteUsers}

# Service Endpoints Configuration
# FIXED cr-java-0071: Externalized service URLs to Azure App Configuration
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}
app.reports.base-url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# Logging Configuration
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.level.com.azure=INFO
