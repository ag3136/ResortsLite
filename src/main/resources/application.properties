# ResortsLite - Cloud-Ready Configuration
# All infrastructure values externalized to environment variables and Azure services

spring.application.name=ResortsLite

# Server port externalized to environment variable for dynamic port assignment
server.port=${SERVER_PORT:8080}

# Database configuration externalized to environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (disabled in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Azure Blob Storage configuration
azure.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:resort-reports}

# Azure Key Vault configuration
azure.keyvault.secret.endpoint=${AZURE_KEYVAULT_SECRET_ENDPOINT:}
azure.keyvault.secret.client-id=${AZURE_KEYVAULT_CLIENT_ID:}
azure.keyvault.secret.client-secret=${AZURE_KEYVAULT_CLIENT_SECRET:}
azure.keyvault.secret.tenant-id=${AZURE_KEYVAULT_TENANT_ID:}

# Azure App Configuration
azure.appconfiguration.endpoint=${AZURE_APPCONFIGURATION_ENDPOINT:}

# Azure Cache for Redis configuration
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:false}

# Session configuration - externalized to Redis
spring.session.store-type=redis
spring.session.redis.namespace=${SPRING_SESSION_NAMESPACE:spring:session}
spring.session.timeout=${SPRING_SESSION_TIMEOUT:1800}

# Externalized service endpoints (loaded from Azure App Configuration)
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Azure Service Bus configuration for scheduled messages
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:resort-scheduled-tasks}

# Report base path externalized
app.report.base-path=${APP_REPORT_BASE_PATH:/var/legacy/reports/}
app.backup.path=${APP_BACKUP_PATH:/var/legacy/backups/}
