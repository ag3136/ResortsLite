# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# retrieved from AWS Systems Manager Parameter Store / Secrets Manager at runtime.

spring.application.name=ResortsLite

# FIX cr-java-0077: Server port is driven by the SERVER_PORT environment variable
# injected by ECS / EKS / Elastic Beanstalk. Default 8080 is used for local dev.
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Database — credentials resolved from AWS Secrets Manager at runtime
# (see BookingService.resolveDbCredentials()).
# The datasource below uses the in-memory H2 database for local development.
# In production, the JDBC URL, username, and password are supplied via
# environment variables backed by AWS Secrets Manager (secret: DB_SECRET_NAME).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session + distributed cache
# FIX cr-java-0065 / cr-java-0067:
# Redis host and port are injected via environment variables so the same
# artifact runs against a local Redis instance (dev) or ElastiCache (prod).
# ---------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session: use Redis as the session store (replaces HttpSession)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resorts:session

# ---------------------------------------------------------------------------
# AWS SDK region — required for S3, Secrets Manager, and SSM clients
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Application-level configuration — resolved from SSM Parameter Store at runtime
# The keys below are used as fallback defaults when SSM is not reachable.
# ---------------------------------------------------------------------------
app.s3.report-bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}
app.db.secret-name=${DB_SECRET_NAME:resorts/db/credentials}
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service/payments/charge}
