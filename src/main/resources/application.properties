# ResortsLite - Legacy Configuration
# FIXED cr-java-0077 [Software Portability]: Replaced hard-coded port with environment variable
# Port is now dynamically assigned by Azure Container Apps or App Service via SERVER_PORT environment variable
# Azure Container Apps and App Service automatically set this variable based on platform requirements
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage Configuration - Replace hard-coded file paths with cloud storage
# Connection string should be provided via environment variable: AZURE_STORAGE_CONNECTION_STRING
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:resort-reports}

# Azure Key Vault Configuration for secure credential management
# Key Vault URL should be provided via environment variable: AZURE_KEYVAULT_URL
# Example: https://<your-keyvault-name>.vault.azure.net/
azure.keyvault.url=${AZURE_KEYVAULT_URL:}
azure.keyvault.db-username-secret=${AZURE_KEYVAULT_DB_USERNAME_SECRET:db-username}
azure.keyvault.db-password-secret=${AZURE_KEYVAULT_DB_PASSWORD_SECRET:db-password}

# FIXED cr-java-0071: Externalized environment-specific URLs to Azure App Configuration
# These URLs can now be configured via environment variables or Azure App Configuration
# This enables environment-agnostic deployments without code changes

# Inventory Service URL - Replace with actual Azure service endpoint
# Example: https://inventory-service.azurewebsites.net/rooms/available
app.inventory.service.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}

# Report Download Base URL - Replace with actual Azure CDN or App Service endpoint
# FIXED cr-java-0067: Cache TTL configuration for distributed Redis cache
# Booking cache TTL in seconds (default: 1 hour = 3600 seconds)
# This prevents indefinite memory growth and ensures cache freshness
# Adjust based on business requirements and data volatility
app.cache.booking.ttl=${CACHE_BOOKING_TTL:3600}
spring.redis.timeout=${REDIS_TIMEOUT:2000}

# Spring Session configuration - use Redis for session storage
spring.session.store-type=redis
spring.session.timeout=1800s

# Azure Cache for Redis configuration
# Connection string format: <redis-host>:<port> or use full connection string
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}

# FIXED cr-java-0090: Azure Active Directory (Entra ID) Authentication Configuration
# Replace file-based authentication with centralized Azure AD identity management
# This enables OAuth 2.0 / OpenID Connect authentication with enterprise-grade security

# Azure AD Tenant Configuration
# Tenant ID can be found in Azure Portal > Azure Active Directory > Overview
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:}

# Application Registration Configuration
# Client ID and Secret are obtained from Azure Portal > App Registrations
# Store client secret in Azure Key Vault for production environments
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_AD_CLIENT_SECRET:}

# Application ID URI - defines the scope for API access
# Format: api://<client-id> or custom URI configured in app registration
azure.activedirectory.app-id-uri=${AZURE_AD_APP_ID_URI:api://resortslite}

# Authorization configuration
# Use Azure AD groups or app roles for role-based access control
azure.activedirectory.user-group.allowed-groups=${AZURE_AD_ALLOWED_GROUPS:ResortsLite-Users,ResortsLite-Admins}
azure.activedirectory.post-logout-redirect-uri=${AZURE_AD_POST_LOGOUT_URI:http://localhost:8080}
