# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Server port externalized to Azure App Configuration and environment variables
# Azure Container Apps and AKS dynamically assign ports. Override via SERVER_PORT environment variable.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge

# Azure Blob Storage Configuration for cloud-native file storage
# Replace with environment variables in production: ${AZURE_STORAGE_CONNECTION_STRING}

# Azure Key Vault Configuration for secure credential management
# FIXED: cr-java-0069 - Migrated hard-coded credentials to Azure Key Vault
# Set AZURE_KEYVAULT_URI environment variable to your Key Vault URL (e.g., https://your-keyvault.vault.azure.net/)
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# Secret names in Azure Key Vault (customize as needed)
azure.keyvault.db-host-secret-name=${AZURE_KEYVAULT_DB_HOST_SECRET:db-host}
azure.keyvault.db-user-secret-name=${AZURE_KEYVAULT_DB_USER_SECRET:db-user}
azure.keyvault.db-pass-secret-name=${AZURE_KEYVAULT_DB_PASS_SECRET:db-password}
azure.storage.blob-endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}

# FIXED cr-java-0071: Externalized environment-specific URLs to Azure App Configuration
# Inventory Service Endpoint - can be overridden via environment variable or Azure App Configuration
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-service.internal:8081/rooms/available}


# FIXED cr-java-0065: Externalized session state to Azure Cache for Redis
# Azure Cache for Redis Configuration for stateless session management
# Replace with environment variables in production
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
# FIXED cr-java-0067: Spring Cache configuration for Azure Cache for Redis
# Enables distributed caching with TTL policies to prevent memory exhaustion
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true

# Configuration for Azure AD OAuth2 Resource Server
# Set these environment variables in production:
# - AZURE_CLIENT_ID: Application (client) ID from Azure AD app registration
# - AZURE_TENANT_ID: Directory (tenant) ID from Azure AD
# - AZURE_CLIENT_SECRET: Client secret from Azure AD app registration (store in Key Vault)

# Azure AD OAuth2 Configuration
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:true}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_CLIENT_SECRET:}

# Azure AD App Roles (optional - for role-based access control)

# FIXED cr-java-0111: Azure Service Bus Configuration for distributed scheduling
# Replaces java.util.Timer with cloud-native scheduled message delivery
# Set AZURE_SERVICEBUS_CONNECTION_STRING environment variable in production
# Format: Endpoint=sb://<namespace>.servicebus.windows.net/;SharedAccessKeyName=<key-name>;SharedAccessKey=<key>
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-scheduler}
azure.servicebus.enabled=${AZURE_SERVICEBUS_ENABLED:true}
spring.session.redis.namespace=spring:session
