# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080
# FIXED: Database credentials now retrieved from Google Secret Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${sm://db-username}
spring.datasource.password=${sm://db-password}

# Google Cloud Secret Manager Configuration
# Enable Secret Manager integration
spring.cloud.gcp.secretmanager.enabled=true
# GCP Project ID (can be overridden via environment variable)
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:}
# Allow bootstrap of Secret Manager before application context


# Google Cloud Storage Configuration (FIXED cr-java-0062)
# These values can be overridden via environment variables for cloud deployment
# GCS_BUCKET_NAME: The GCS bucket name for storing reports (default: resort-reports-bucket)
# GCS_REPORT_PREFIX: The prefix/folder for reports in GCS (default: reports/)
# GCS_BACKUP_PREFIX: The prefix/folder for backups in GCS (default: backups/nightly/)
# Note: GCS authentication uses Application Default Credentials (ADC) in GCP environments

# FIXED cr-java-0071: Externalized environment-specific URLs
# These URLs can be configured per environment (dev, staging, production) via environment variables
# Default values use HTTPS for cloud security compliance

# FIXED cr-java-0065: Redis Session Management for GCP Memorystore
# Enables stateless session storage across distributed instances
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Redis Configuration for GCP Memorystore
# REDIS_HOST: GCP Memorystore Redis instance IP (default: localhost for local dev)
# REDIS_PORT: Redis port (default: 6379)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# FIXED cr-java-0067: Redis Cache Configuration with TTL
# Enables distributed caching across all instances with automatic expiration
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
