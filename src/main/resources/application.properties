# ResortsLite - Cloud-Ready Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port configuration now supports environment variable injection
# In cloud environments (ECS/EKS/Elastic Beanstalk), set SERVER_PORT environment variable
# or retrieve from AWS Parameter Store: /resortslite/server-port
# Default value used for local development only
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# AWS Secrets Manager Configuration
# Database credentials are now stored in AWS Secrets Manager instead of hard-coded values
aws.secretsmanager.secret.name=${AWS_SECRET_NAME:resorts-db-credentials}
aws.region=${AWS_REGION:us-east-1}

# AWS S3 Configuration for cloud-native file storage
aws.s3.bucket.name=${AWS_S3_BUCKET:resorts-reports-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
# AWS Cognito Configuration for cloud-native user authentication
# FIXED cr-java-0090: Replaced file-based authentication with Amazon Cognito
# User credentials and identity management now handled by Cognito User Pool
aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.clientId=${AWS_COGNITO_CLIENT_ID:}

aws.parameterstore.reports.url=/resortslite/reports-download-url
aws.parameterstore.server.port=/resortslite/server-port
# Default values (used if Parameter Store is not available in local development)
inventory.service.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}

# FIXED cr-java-0065: Spring Session with Amazon ElastiCache for Redis
# Distributed session management enables stateless application instances
# Session data is stored in Redis cluster, allowing horizontal scaling and load balancing
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Amazon ElastiCache for Redis Configuration
# Use environment variables for cloud deployment (ECS/EKS/Elastic Beanstalk)

# FIXED cr-java-0067: Redis Cache Configuration with TTL
# Cache TTL set to 30 minutes (1800000 ms) to prevent indefinite memory growth
# Ensures automatic expiration of stale data across all application instances
spring.cache.redis.time-to-live=1800000
