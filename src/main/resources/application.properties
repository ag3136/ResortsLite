# ResortsLite - Cloud-Native Configuration (AWS)
spring.application.name=ResortsLite

# Server port — injected from environment variable SERVER_PORT at runtime.
# ECS/EKS/Elastic Beanstalk will override this via environment injection.
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Datasource URL, username, and password are injected from environment variables
# populated by AWS Secrets Manager at container startup (cr-java-0069).
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ─── AWS Configuration ───────────────────────────────────────────────────────
# AWS region injected from environment variable (standard AWS SDK convention)
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.stack.auto=false

# AWS Secrets Manager — secret names for DB credentials and payment endpoint (cr-java-0069)
cloud.aws.secrets.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
cloud.aws.secrets.payment-secret-name=${PAYMENT_SECRET_NAME:resortslite/payment/endpoint}

# ─── Amazon S3 — Report Storage ──────────────────────────────────────────────
# S3 bucket and prefix replace hard-coded /var/legacy/reports/ path (cr-java-0061)
cloud.aws.s3.report-bucket=${REPORT_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.report-prefix=${REPORT_S3_PREFIX:reports/}

# ─── Amazon ElastiCache (Redis) — Session & Cache ────────────────────────────
# Spring Session backed by ElastiCache Redis (cr-java-0065, cr-java-0067)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Booking cache TTL in seconds (default 30 minutes) — cr-java-0067
cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}

# ─── Service Endpoints (AWS SSM Parameter Store) ─────────────────────────────
# All internal service endpoints are injected from environment variables
# populated by AWS SSM Parameter Store at deployment time (cr-java-0071).
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-service.internal:8081/rooms/available}
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# SSM parameter name for report download URL (cr-java-0071)
REPORT_DOWNLOAD_URL_PARAM=${REPORT_DOWNLOAD_URL_PARAM:/resortslite/report/download-url}
