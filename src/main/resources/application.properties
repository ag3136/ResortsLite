# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms

# AWS S3 Configuration for cloud-native file storage
# Replace hard-coded file paths with S3 bucket storage
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}

# AWS Systems Manager Parameter Store keys for externalized environment URLs
# These parameters should be configured in AWS Parameter Store for each environment
aws.paramstore.inventory.url.key=/resortslite/inventory/service/url
aws.paramstore.reports.url.key=/resortslite/reports/service/url
aws.paramstore.inventory.url.default=https://inventory-service.internal:8081/rooms/available
aws.paramstore.reports.url.default=https://reports.resorts-internal.com:8080/download

# Spring Session with Redis (Amazon ElastiCache) - Distributed session management
# FIXED cr-java-0065: Enables stateless application instances with centralized session storage
# All HTTP session data is now stored in Redis/ElastiCache instead of local memory
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Redis/ElastiCache Configuration

# Redis Cache Configuration for Amazon ElastiCache
# FIXED cr-java-0067: Distributed caching with TTL to prevent memory growth
# Replaces in-memory HashMap with centralized Redis cache
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false
spring.redis.port=${REDIS_PORT:6379}
