# ResortsLite - Legacy Configuration
# FIXED cr-java-0077: Server port now supports dynamic assignment via environment variable
# Azure Container Apps and AKS dynamically assign ports. This default can be overridden by
# setting SERVER_PORT environment variable. In production, use Azure App Configuration.
# Default: 8080 (for local development only)
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# FIXED cr-java-0071: Externalized report download URL to configuration
# In production, this should be loaded from Azure App Configuration for environment-agnostic deployments
# Replace with HTTPS endpoint and use Azure Front Door or Application Gateway for production
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080}

# Azure Blob Storage Configuration - Cloud-native file storage
# Connection string should be externalized to Azure Key Vault in production
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:resort-reports}

# FIXED cr-java-0065: Externalized session state to Azure Cache for Redis
# Spring Session automatically stores HTTP session data in Redis instead of in-memory
# This enables stateless application architecture and horizontal scaling across multiple instances
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Azure Cache for Redis connection configuration

# FIXED cr-java-0090: Azure Active Directory (Entra ID) Authentication Configuration
# Replaces file-based authentication with cloud-native identity management
# Azure AD provides centralized authentication, SSO, MFA, and role-based access control
# Configuration values should be stored in Azure Key Vault in production

# Azure AD OAuth2 Configuration
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:true}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
# Redis host should be externalized to Azure App Configuration in production
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=60000

# FIXED cr-java-0067: Spring Cache configuration with Azure Cache for Redis
# Enables distributed caching with TTL policies to prevent memory exhaustion
# Cache is shared across all application instances for consistency
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID}/discovery/v2.0/keys

# Application security settings
app.security.enabled=${SECURITY_ENABLED:true}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=60000
