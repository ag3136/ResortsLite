# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.

# Google Cloud Storage Configuration for cloud-native file operations
# Replace hard-coded file paths with GCS bucket storage
gcs.bucket.name=${GCS_BUCKET_NAME:resorts-lite-reports}
gcs.project.id=${GCS_PROJECT_ID:}
gcs.reports.folder=reports/

# Google Cloud Secret Manager Configuration
# Enable Spring Cloud GCP Secret Manager
spring.cloud.gcp.secretmanager.enabled=true
spring.cloud.gcp.secretmanager.project-id=${GCP_PROJECT_ID:}

# Database credentials from Secret Manager
spring.datasource.username=${sm://db-username}
spring.datasource.password=${sm://db-password}

# Inventory Service URL - can be overridden with INVENTORY_SERVICE_URL environment variable
inventory.service.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081}

# Report Download Base URL - can be overridden with REPORT_DOWNLOAD_BASE_URL environment variable
spring.session.redis.namespace=spring:session

# Google Cloud Memorystore for Redis connection
# Override with environment variables: REDIS_HOST, REDIS_PORT, REDIS_PASSWORD
spring.redis.host=${REDIS_HOST:localhost}

# Spring Cache Configuration with Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
# Cache TTL: 1 hour (3600000ms) - prevents indefinite memory growth
# All cache entries automatically expire after 1 hour
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=resortslite:
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
