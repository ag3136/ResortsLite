spring.application.name=ResortsLite

server.port=${SERVER_PORT:${PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

spring.session.store-type=redis
spring.session.redis.namespace=${SESSION_REDIS_NAMESPACE:resortslite:session}
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:false}

app.payment.endpoint=${PAYMENT_API_URL:https://payments.example.internal/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory.example.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notify.example.internal/send}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.example.internal/download}
app.report.server-port=${REPORT_SERVER_PORT:${SERVER_PORT:${PORT:8080}}}
app.report.container-name=${AZURE_BLOB_REPORTS_CONTAINER:reports}
app.report.backup-container-name=${AZURE_BLOB_BACKUP_CONTAINER:report-backups}
app.report.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.report.storage.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
app.report.schedule.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-jobs}
app.report.schedule.topic-name=${AZURE_SERVICEBUS_TOPIC_NAME:report-jobs}
app.report.schedule.use-topic=${AZURE_SERVICEBUS_USE_TOPIC:false}
app.report.schedule.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
app.config.inventory-url-key=${APP_CONFIG_INVENTORY_URL_KEY:app.inventory.endpoint}
app.config.report-download-url-key=${APP_CONFIG_REPORT_DOWNLOAD_URL_KEY:app.report.download-base-url}
app.config.report-port-key=${APP_CONFIG_REPORT_PORT_KEY:app.report.server-port}
app.config.connection-string=${AZURE_APP_CONFIGURATION_CONNECTION_STRING:}
app.keyvault.url=${AZURE_KEYVAULT_URL:}
app.keyvault.db-user-secret=${AZURE_KEYVAULT_DB_USER_SECRET:db-user}
app.keyvault.db-pass-secret=${AZURE_KEYVAULT_DB_PASS_SECRET:db-password}
app.keyvault.db-host-secret=${AZURE_KEYVAULT_DB_HOST_SECRET:db-host}
app.security.aad-enabled=${AZURE_AD_ENABLED:false}
