spring.application.name=ResortsLite
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

azure.keyvault.url=${AZURE_KEYVAULT_URL:}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.endpoint=${AZURE_STORAGE_ENDPOINT:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}
azure.appconfig.connection-string=${AZURE_APPCONFIG_CONNECTION_STRING:}
azure.appconfig.endpoint=${AZURE_APPCONFIG_ENDPOINT:}
azure.appconfig.key-id=${AZURE_APPCONFIG_KEY_ID:}
azure.appconfig.secret=${AZURE_APPCONFIG_SECRET:}
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-jobs}

spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
app.redis.ttl-minutes=${APP_REDIS_TTL_MINUTES:30}

spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payments.example.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory.example.internal/rooms/available}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.example.internal/send}
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:https://reports.example.internal/download/}
app.report.server-port=${APP_REPORT_SERVER_PORT:${SERVER_PORT:8080}}
