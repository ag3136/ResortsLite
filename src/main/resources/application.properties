spring.application.name=ResortsLite
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}

spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:sessions

spring.cloud.azure.appconfiguration.enabled=${AZURE_APP_CONFIGURATION_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APP_CONFIGURATION_ENDPOINT:}
spring.cloud.azure.credential.managed-identity-enabled=${AZURE_MANAGED_IDENTITY_ENABLED:false}

spring.cloud.azure.active-directory.enabled=${AZURE_ACTIVE_DIRECTORY_ENABLED:false}
