# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port configuration now supports dynamic assignment
# Port can be injected via AWS Parameter Store, environment variables, or ECS/EKS task definition
# Default fallback is 8080 for local development only
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge

# AWS S3 Configuration for Report Storage (replaces hard-coded file paths)
# These values should be externalized to AWS Parameter Store or environment variables in production
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}

# Spring Session Configuration - Amazon ElastiCache for Redis
# Enables distributed session management for stateless, horizontally scalable application instances
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Redis Configuration - Amazon ElastiCache
# In production, these values should be externalized to AWS Parameter Store or environment variables

# Cache TTL Configuration - Amazon ElastiCache for Redis
# Booking cache entries expire after 60 minutes to prevent memory growth and ensure data freshness
app.cache.booking.ttl.minutes=${CACHE_BOOKING_TTL_MINUTES:60}
