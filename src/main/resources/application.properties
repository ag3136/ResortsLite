# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077 [Networking & Communication / Critical]: Server port now supports dynamic assignment
# Port configuration is externalized to support container orchestration platforms (ECS, EKS, Elastic Beanstalk)
# 
# Port can be configured via:
# 1. Environment variable: SERVER_PORT (recommended for containers)
#    Example: export SERVER_PORT=8080
# 2. AWS Parameter Store: /resorts-lite/server-port
#    Example: aws ssm put-parameter --name "/resorts-lite/server-port" --value "8080" --type "String"
# 3. ECS task definition environment variables
# FIXED cr-java-0065 [State Management & Session Issues / High]: HTTP Session State Storage
# Migrated from in-memory HTTP sessions to Amazon ElastiCache for Redis using Spring Session.
# This enables stateless application instances with centralized, distributed session management.
#
# Spring Session Configuration - Redis backed distributed sessions
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session
# Session timeout (30 minutes default)
spring.session.timeout=1800s

# Redis Configuration for Amazon ElastiCache
# Redis host should be configured via environment variable for different environments
# For AWS ElastiCache, use the cluster endpoint (e.g., resorts-lite-redis.abc123.0001.use1.cache.amazonaws.com)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# Redis connection pool configuration (using Lettuce)
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=-1ms

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
# Redis Cache Configuration for Amazon ElastiCache
# FIXED cr-java-0067 [State Management & Session Issues / Medium]: In-Memory Caching Without TTL
# Migrated from unbounded in-memory HashMap caching to Amazon ElastiCache for Redis with TTL policies.
# This prevents indefinite memory growth and ensures consistent cache data across all instances.
#
# Cache TTL Configuration (configured in RedisCacheConfig.java):
# - Default cache TTL: 15 minutes
# - Booking cache TTL: 30 minutes
# - Availability cache TTL: 5 minutes
# - Report cache TTL: 60 minutes
#
# Benefits:
# - Controlled expiration prevents memory leaks
# - Centralized cache shared across all EC2 instances
# - Automatic eviction of expired entries
# - Horizontal scaling without cache inconsistencies
spring.cache.type=redis

# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms

# AWS S3 Configuration for cloud-native file storage
# Replace hard-coded file paths with S3 bucket storage
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
aws.s3.backups.prefix=backups/nightly/

# AWS Secrets Manager Configuration
# FIXED [cr-java-0069]: Database credentials are now stored in AWS Secrets Manager for secure management
# Secret should contain JSON with keys: host, username, password, database, port
# Example secret JSON format:
# {
#   "host": "db-prod.resorts-internal.com",
#   "username": "admin",
#   "password": "secure-password-here",
#   "database": "resortdb",
#   "port": "3306"
# }
aws.secretsmanager.secret-name=${AWS_SECRET_NAME:resorts-lite/db-credentials}

# AWS Systems Manager Parameter Store Configuration
# FIXED cr-java-0071: Externalized environment-specific URLs to AWS Parameter Store
# This enables environment-agnostic deployments without code changes
# 
# Parameter Store paths for environment-specific URLs:
# - /resorts-lite/inventory-service-url: URL for inventory service (e.g., https://inventory-service.internal:8081/rooms/available)

# AWS Cognito Configuration
# FIXED [cr-java-0090]: Migrated from file-based authentication to AWS Cognito
# AWS Cognito provides centralized, encrypted, and auditable authentication with
# built-in user lifecycle management, replacing local file-based user storage.
#
# Configuration:
# - User Pool ID: Unique identifier for the Cognito User Pool
# - Client ID: App client ID for authentication
# - Region: AWS region where Cognito User Pool is deployed
#
# To create a Cognito User Pool:
# aws cognito-idp create-user-pool --pool-name resorts-lite-users --policies "PasswordPolicy={MinimumLength=8,RequireUppercase=true,RequireLowercase=true,RequireNumbers=true}"
# aws cognito-idp create-user-pool-client --user-pool-id <pool-id> --client-name resorts-lite-app --explicit-auth-flows ALLOW_USER_PASSWORD_AUTH ALLOW_REFRESH_TOKEN_AUTH
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.client-id=${AWS_COGNITO_CLIENT_ID:}
aws.cognito.region=${AWS_REGION:us-east-1}
# aws ssm put-parameter --name "/resorts-lite/inventory-service-url" --value "https://inventory-service.internal:8081/rooms/available" --type "String"
# aws ssm put-parameter --name "/resorts-lite/reports-service-url" --value "https://reports.resorts-internal.com:8080/download/" --type "String"
#
# For different environments (dev, staging, prod), use environment-specific parameter paths:
# - /resorts-lite/dev/inventory-service-url
# - /resorts-lite/staging/inventory-service-url
# - /resorts-lite/prod/inventory-service-url
aws.parameterstore.region=${AWS_REGION:us-east-1}
aws.parameterstore.inventory.url.path=${AWS_PARAM_INVENTORY_URL:/resorts-lite/inventory-service-url}
aws.parameterstore.reports.url.path=${AWS_PARAM_REPORTS_URL:/resorts-lite/reports-service-url}
